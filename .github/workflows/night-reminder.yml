name: Night Study Reminder

on:
  schedule:
    # 9:00 PM IST = 3:30 PM UTC
    - cron: '30 15 * * *'

permissions:
  issues: write

jobs:
  night-nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and remind
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node << 'SCRIPT_EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          function gh(cmd) {
            return execSync(`gh ${cmd}`, { encoding: 'utf-8' }).trim();
          }

          const progress = JSON.parse(fs.readFileSync('study-plan/progress.json', 'utf-8'));
          const REPO = process.env.REPO;
          const ALL_TRACKS = ['dsa', 'system_design', 'sql', 'machine_coding'];

          // Find today's issue — use any track's last_issue_number (they all share the same issue)
          const issueNumber = progress.dsa.last_issue_number;

          if (!issueNumber) {
            console.log('No issue found. Skipping night reminder.');
            process.exit(0);
          }

          // Check if issue is still open
          let issueState;
          try {
            const issueJson = gh(`issue view ${issueNumber} --repo ${REPO} --json state`);
            issueState = JSON.parse(issueJson).state;
          } catch (e) {
            console.log('Could not check issue:', e.message);
            process.exit(0);
          }

          if (issueState === 'CLOSED') {
            console.log(`Issue #${issueNumber} already closed. You completed today's tasks!`);
            process.exit(0);
          }

          // Issue is still open — send night reminder
          const streak = progress.streak ? progress.streak.current : 0;
          const maxSkips = Math.max(...ALL_TRACKS.map(t => progress[t].consecutive_skips));

          let msg = '';

          if (maxSkips >= 3) {
            msg = `🚨 **9 PM — FINAL CALL!**

You've already skipped **${maxSkips} days in a row**. You promised yourself: no more than 3 consecutive skips.

The issue is still open. You have **3 hours** before the day ends. Even doing 1-2 tasks is better than a full skip.

**Stop scrolling. Open the tasks. Start NOW.**`;
          } else if (maxSkips >= 1) {
            msg = `⏰ **9 PM Reminder — Don't skip again!**

You already skipped yesterday. Two skips in a row and you're on thin ice.

${streak > 0 ? `Your **${streak}-day streak** is at risk. Don't throw it away.` : `You need to rebuild your streak. Start tonight.`}

Close this issue before midnight to keep your progress moving.`;
          } else if (streak >= 5) {
            msg = `🔥 **9 PM Check-in — Protect your ${streak}-day streak!**

You've been consistent for ${streak} days straight. That's real discipline.

Don't let tonight be the night you break it. The tasks are waiting — finish them and close this issue.`;
          } else {
            msg = `🌙 **9 PM Reminder — Tasks still pending!**

Today's study tasks are still open. You have the rest of the evening to get them done.

${streak > 0 ? `Current streak: **${streak} days**. Keep it going!` : `Start building your streak today. Every day 1 has to start somewhere.`}

**Tip:** Even if you're tired, do the DSA problems first — they take the least time but build the most long-term value.`;
          }

          try {
            gh(`issue comment ${issueNumber} --repo ${REPO} --body "${msg.replace(/"/g, '\\"')}"`);
            console.log(`Night reminder added to issue #${issueNumber}`);
          } catch (e) {
            // Use body-file approach for complex messages
            fs.writeFileSync('/tmp/night_msg.md', msg);
            gh(`issue comment ${issueNumber} --repo ${REPO} --body-file /tmp/night_msg.md`);
            console.log(`Night reminder added to issue #${issueNumber} (via file)`);
          }

          SCRIPT_EOF
